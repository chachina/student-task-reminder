<!DOCTYPE html>
<html>
<head>

<title>Profile</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.sidebar{
    width:230px;
    height:100vh;
    background:#1e3a8a;
    color:white;
    position:fixed;
}

.sidebar h2{
    text-align:center;
}

.sidebar a{
    display:block;
    color:white;
    padding:15px 20px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#2563eb;
}

.content{
    margin-left:250px;
    padding:30px;
}

.profile-card{

    background:white;
    width:500px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;

}

.profile-card p{

    font-size:18px;

}

</style>

</head>

<body>


<div class="sidebar">

<h2>🎓 Planner</h2>

<a href="{{ url_for('student_dashboard') }}">📊 Dashboard</a>
<a href="{{ url_for('student_calendar') }}">📅 Calendar</a>
<a href="{{ url_for('student_reports') }}">📈 Reports</a>
<a href="{{ url_for('student_profile') }}">👤 Profile</a>
<a href="{{ url_for('add_task') }}">➕ Add Task</a>
<a href="{{ url_for('logout') }}">🚪 Logout</a>

</div>


<div class="content">

<h1>👤 Student Profile</h1>


<div class="profile-card">

<p><b>Name:</b>
{{ student.full_name }}
</p>


<p><b>Email:</b>
{{ student.email }}
</p>


<p><b>Registration Number:</b>
{{ student.registration_no }}
</p>


<p><b>Course:</b>
{{ student.course }}
</p>


<p><b>Year of Study:</b>
{{ student.year_of_study }}
</p>
<br>

<a href="{{ url_for('student_edit_profile') }}">
    <button style="
        padding:10px 20px;
        background:#2563eb;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    ">
        ✏️ Edit Profile
    </button>
</a>


</div>


</div>


</body>
</html>
