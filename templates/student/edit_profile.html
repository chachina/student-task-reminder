<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}


.container{

    margin:50px auto;
    background:white;
    width:400px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;

}


input{

    width:100%;
    padding:10px;
    margin:10px 0;

}


button{

    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}


button:hover{

    background:#1d4ed8;

}


</style>

</head>


<body>

{% if updated %}
<script>
alert('Profile updated successfully!');
window.location='{{ url_for("student_profile") }}';
</script>
{% endif %}

<div class="container">


<h2>✏️ Edit Profile</h2>


<form method="POST">


<label>Full Name</label>

<input type="text" name="full_name"
value="{{ student.full_name }}">



<label>Email</label>

<input type="email" name="email"
value="{{ student.email }}">



<label>Course</label>

<input type="text" name="course"
value="{{ student.course }}">



<label>Year of Study</label>

<input type="text" name="year_of_study"
value="{{ student.year_of_study }}">



<button name="update">
Save Changes
</button>


</form>


</div>


</body>

</html>
