<!DOCTYPE html>
<html>
<head>

<title>Student Academic Planner - Calendar</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.sidebar{
    width:230px;
    height:100vh;
    background:#1e3a8a;
    color:white;
    position:fixed;
    padding-top:20px;
    overflow-y:auto;
}

.sidebar h2{
    text-align:center;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#2563eb;
}

.content{
    margin-left:250px;
    padding:30px;
}

.content h1{
    color:#333;
    margin-bottom:20px;
}

#calendar{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
}

.modal-content {
    background-color: white;
    margin: 10% auto;
    padding: 30px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    max-height: 80vh;
    overflow-y: auto;
}

.modal-content h2 {
    color: #333;
    margin-top: 0;
}

.modal-content input,
.modal-content textarea,
.modal-content select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    box-sizing: border-box;
}

.modal-content textarea {
    min-height: 80px;
    resize: vertical;
}

.modal-content input:focus,
.modal-content textarea:focus,
.modal-content select:focus {
    outline: none;
    border: 2px solid #2563eb;
    background-color: #f9f9f9;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.btn-save {
    background-color: #4CAF50;
    color: white;
}

.btn-save:hover {
    background-color: #45a049;
}

.btn-cancel {
    background-color: #f0f0f0;
    color: #333;
}

.btn-cancel:hover {
    background-color: #e0e0e0;
}

.success-message {
    display: none;
    background-color: #4CAF50;
    color: white;
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 20px;
    text-align: center;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>🎓 Planner</h2>

<a href="{{ url_for('student_dashboard') }}">📊 Dashboard</a>
<a href="{{ url_for('student_calendar') }}">📅 Calendar</a>
<a href="javascript:openAddTask('')">➕ Add Task</a>
<a href="{{ url_for('student_reports') }}">📈 Reports</a>
<a href="{{ url_for('student_profile') }}">👤 Profile</a>
<a href="{{ url_for('student_notifications') }}">🔔 Notifications</a>
<a href="{{ url_for('logout') }}">🚪 Logout</a>

</div>

<div class="content">

<h1>📅 Academic Calendar</h1>

<div class="success-message" id="successMessage">✅ Task saved successfully!</div>

<div id="calendar"></div>

</div>

<!-- Add/Edit Task Modal -->
<div id="taskModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">➕ Add Task</h2>

        <form id="taskForm" method="POST">
            <input type="hidden" id="task_id" name="task_id">
            <input type="hidden" id="form_type" name="form_type" value="add">

            <input type="text" id="task_title" name="task_title" placeholder="Task Title" required>

            <textarea id="description" name="description" placeholder="Task Description (optional)"></textarea>

            <input type="date" id="due_date" name="due_date" required>

            <select id="status" name="status" style="display:none;">
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="In Progress">In Progress</option>
            </select>

            <div class="modal-buttons">
                <button type="submit" class="btn-save">💾 Save Task</button>
                <button type="button" class="btn-cancel" onclick="closeTask()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>

document.addEventListener('DOMContentLoaded', function () {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: 'dayGridMonth',
        height: 'auto',
        events: '{{ url_for("events") }}',

        dateClick: function(info){
            openAddTask(info.dateStr);
        },

        eventClick: function(info){
            editTask(info.event.id);
        }

    });

    calendar.render();

});

function openAddTask(date){
    document.getElementById("taskModal").style.display = "block";
    document.getElementById("modalTitle").innerText = "➕ Add Task";
    document.getElementById("form_type").value = "add";
    document.getElementById("status").style.display = "none";
    document.getElementById("task_id").value = "";
    document.getElementById("taskForm").reset();
    document.getElementById("due_date").value = date || '';
    document.getElementById("task_title").focus();
}

function editTask(taskId){
    fetch("{{ url_for('student_calendar') }}?fetch_task=" + taskId)
    .then(response => response.json())
    .then(data => {
        if(data.success){
            let task = data.task;
            document.getElementById("taskModal").style.display = "block";
            document.getElementById("modalTitle").innerText = "✏️ Edit Task";
            document.getElementById("form_type").value = "edit";
            document.getElementById("status").style.display = "block";
            document.getElementById("task_id").value = task.task_id;
            document.getElementById("task_title").value = task.task_title;
            document.getElementById("description").value = task.task_description;
            document.getElementById("due_date").value = task.due_date;
            document.getElementById("status").value = task.status;
            document.getElementById("task_title").focus();
        }
    });
}

function closeTask(){
    document.getElementById("taskModal").style.display = "none";
    document.getElementById("taskForm").reset();
}

// Handle form submission with AJAX
document.getElementById("taskForm").addEventListener("submit", function(e){
    e.preventDefault();

    let formType = document.getElementById("form_type").value;
    let formData = new FormData(this);

    if(formType === "edit"){
        formData.append("update_task", "1");
    }

    fetch(window.location.href, {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if(data.success){
            document.getElementById("successMessage").style.display = "block";
            closeTask();

            setTimeout(() => {
                location.reload();
            }, 1000);
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => {
        console.error("Error:", error);
        alert("An error occurred");
    });
});

</script>

</body>
</html>
