<!DOCTYPE html>
<html>
<head>

<title>Reports</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}

.sidebar{
    width:230px;
    height:100vh;
    background:#1e3a8a;
    color:white;
    position:fixed;
}

.sidebar h2{
    text-align:center;
}

.sidebar a{
    display:block;
    color:white;
    padding:15px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#2563eb;
}

.content{
    margin-left:250px;
    padding:30px;
}

.cards{
    display:flex;
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    flex:1;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 10px #ddd;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>🎓 Planner</h2>

<a href="{{ url_for('student_dashboard') }}">📊 Dashboard</a>
<a href="{{ url_for('student_calendar') }}">📅 Calendar</a>
<a href="{{ url_for('student_reports') }}">📈 Reports</a>
<a href="{{ url_for('add_task') }}">➕ Add Task</a>
<a href="{{ url_for('logout') }}">🚪 Logout</a>

</div>


<div class="content">

<h1>📈 Task Reports</h1>

<div class="cards">

<div class="card">
<h2>{{ total }}</h2>
<p>Total Tasks</p>
</div>
<canvas id="taskChart" style="max-width:500px;margin-top:40px;"></canvas>


<div class="card">
<h2>{{ pending }}</h2>
<p>Pending</p>
</div>


<div class="card">
<h2>{{ completed }}</h2>
<p>Completed</p>
</div>


<div class="card">
<h2>{{ overdue }}</h2>
<p>Overdue</p>
</div>


</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('taskChart');

new Chart(ctx, {

    type: 'pie',

    data: {

        labels: [
            'Pending',
            'Completed',
            'Overdue'
        ],

        datasets: [{
            data: [
                {{ pending }},
                {{ completed }},
                {{ overdue }}
            ]
        }]

    },

    options: {
        plugins:{
            title:{
                display:true,
                text:'Task Completion Overview'
            }
        }
    }

});

</script>
</body>
</html>
