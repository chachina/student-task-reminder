<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .edit-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            margin-top: 30px;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        label {
            display: block;
            color: #555;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border: 2px solid #4CAF50;
            background-color: #f9f9f9;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
        }

        .btn-save:hover {
            background-color: #45a049;
        }

        .btn-cancel {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

<div class="edit-container">
    <h2>✏️ Edit Task</h2>

    <form method="POST">
        <label>Task Title</label>
        <input type="text" name="task_title" value="{{ task.task_title }}" required>

        <label>Description</label>
        <textarea name="description" placeholder="Task Description (optional)">{{ task.task_description }}</textarea>

        <label>Due Date</label>
        <input type="date" name="due_date" value="{{ task.due_date }}" required>

        <label>Status</label>
        <select name="status" required>
            <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
            <option value="In Progress" {% if task.status == 'In Progress' %}selected{% endif %}>In Progress</option>
        </select>

        <div class="button-group">
            <button type="submit" name="update_task" class="btn-save">💾 Update Task</button>
            <button type="button" class="btn-cancel" onclick="history.back()">Back</button>
        </div>
    </form>
</div>

</body>
</html>
